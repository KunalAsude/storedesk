name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  # Required check: production (main) only takes release PRs from develop or hotfix/* branches.
  pr-source:
    runs-on: ubuntu-latest
    steps:
      - name: PRs into main come from develop or hotfix/*
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "develop" ] && [[ "$HEAD" != hotfix/* ]]; then
            echo "::error::PRs into main must come from develop or hotfix/* (got '$HEAD'). Open this PR against develop."
            exit 1
          fi
          echo "ok"
  check:
    runs-on: ubuntu-latest
    services:
      # Throwaway Postgres for packages/db tests (same image and test-only credentials as docker-compose.yml)
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: storedesk
          POSTGRES_PASSWORD: storedesk
          POSTGRES_DB: storedesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U storedesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://storedesk:storedesk@localhost:5432/storedesk
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run --cwd apps/web check:release
      - run: bun run --cwd apps/web build
      # The deploy image must keep building (Render builds the same Dockerfile).
      - run: docker build -f apps/api/Dockerfile -t storedesk-api:ci .
